<header class="bar">
  <a class="brand" href="/" aria-label="MODEXA3D" dir="ltr">
    <span class="mark" aria-hidden="true">M</span>
    <span class="name">MODEXA<span class="accent">3D</span></span>
  </a>

  <div class="actions">
    <button
      class="btn icon lang"
      type="button"
      [attr.aria-label]="i18n.t('lang.switch')"
      [title]="i18n.t('lang.switch')"
      (click)="i18n.toggle()"
    >
      {{ i18n.t('lang.short') }}
    </button>

    <button
      class="btn icon"
      type="button"
      [attr.aria-label]="
        theme.theme() === 'dark' ? i18n.t('theme.toLight') : i18n.t('theme.toDark')
      "
      [title]="theme.theme() === 'dark' ? i18n.t('theme.light') : i18n.t('theme.dark')"
      (click)="theme.toggle()"
    >
      @if (theme.theme() === 'dark') {
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
          />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
      }
    </button>

    <button
      class="btn"
      type="button"
      [title]="i18n.t('topbar.exportTitle')"
      [attr.aria-label]="i18n.t('topbar.exportTitle')"
      [disabled]="!store.hasModel() || store.exporting()"
      (click)="store.exportModel()"
    >
      {{ i18n.t('topbar.export') }}
    </button>

    <button class="btn primary" type="button" (click)="store.openFilePicker()">
      {{ i18n.t('topbar.upload') }}
    </button>
  </div>
</header>
